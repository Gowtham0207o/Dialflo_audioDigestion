[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project]
name = "dialflo-audio-digestion"
version = "0.1.0"
description = "Real-time audio attribute inference service for logistics voice AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Gowtham", email = "gowtham@example.com" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "speechbrain>=1.0.0",
    "transformers>=4.40.0",
    "pydub>=0.25.1",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
eval = [
    "datasets>=2.20.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "tabulate>=0.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no model loading)",
    "integration: Integration tests (loads models)",
    "e2e: End-to-end tests (requires Docker)",
    "slow: Slow tests (model inference)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["src/app"]
omit = ["tests/*", "eval/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
