services:
  audio-digestion:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dialflo-audio-digestion
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_LOG_LEVEL=INFO
      - MODEL_DEVICE=cpu
    volumes:
      - model-cache:/app/models
    tmpfs:
      - /tmp:size=256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true

volumes:
  model-cache:
    driver: local
